    <!-- Critical CSS: font fallback + hero shell (visible before JS hydrates) -->
    <style>
      @font-face {
        font-family: 'DM Sans Fallback';
        src: local('Arial');
        size-adjust: 96%;
        ascent-override: 95%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'JetBrains Mono Fallback';
        src: local('Courier New');
        size-adjust: 98%;
        ascent-override: 92%;
        descent-override: 24%;
        line-gap-override: 0%;
      }
      html { font-family: 'DM Sans', 'DM Sans Fallback', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif; }
      body { margin: 0; padding: 0; background: #000000; color: #fafafa; }
      #root { min-height: 100vh; }
      /* Pre-render shell: shown until React mounts */
      #shell { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
      #shell .shell-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 24px; height: 64px; display: flex; align-items: center; background: rgba(0,0,0,0.45); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); }
      #shell .shell-nav img { height: 32px; width: auto; }
      #shell .shell-hero { flex: 1; display: flex; align-items: center; padding: 80px 24px 40px; max-width: 1180px; margin: 0 auto; width: 100%; box-sizing: border-box; }
      #shell .shell-hero h1 { font-size: clamp(42px, 6vw, 76px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin: 0; color: #fafafa; }
      #shell .shell-hero .accent { background: linear-gradient(90deg, #10B981, #0891B2, #10B981); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      #shell .shell-sub { font-size: clamp(15px, 2vw, 18px); color: #a1a1aa; line-height: 1.7; margin: 16px 0 0; max-width: 640px; }
      /* Hide shell when React has rendered */
      #root:not(:empty) ~ #shell { display: none; }
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NZSQKMW7" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div id="root"></div>
    <!-- Pre-rendered shell: immediate FCP/LCP before JS loads -->
    <div id="shell" aria-hidden="true">
      <nav class="shell-nav">
        <img src="/orbit-logo-dark.png" alt="Orbit" width="144" height="32" fetchpriority="high" />
      </nav>
      <div class="shell-hero">
        <div>
          <h1>Operamos mercados de predicci&oacute;n. <span class="accent">Con inteligencia artificial.</span></h1>
          <p class="shell-sub">Inteligencia, cobertura y capital cuantitativo para empresas en Am&eacute;rica Latina. Todo impulsado por mercados de predicci&oacute;n y agentes de IA.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
        <!-- GTM deferred to after page is interactive -->
    <script src="/ga-loader.js" defer></script>
  </body>
